# Render Blueprint — one web service running the whole app (React + API + alarm scheduler).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on creation.
services:
  - type: web
    name: myfit-routine
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Same region as the Neon database (us-east-2 / Ohio) so each query takes milliseconds.
    region: ohio
    # Always-on plan: the free plan sleeps after 15 min idle, which stops alarm push notifications.
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    # GitHub Actions deploys via the deploy hook after tests + migrations pass.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: my-gym
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
